<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA 6-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>VICE COVER<br>STUDIO</h1>
    <p class="tag">Your photo, your caption — a GTA 6-style poster cover, made offline.</p>

    <label class="field">Photos
      <span class="filerow">
        <input id="photo" type="file" accept="image/*" multiple>
        <span class="hint">Add your own, or use the samples.</span>
      </span>
    </label>
    <div id="tray" class="tray" aria-label="Photo tray"></div>
    <p class="hint">Click a photo to put it in the selected panel. Click a panel on the cover to select it, drag to move its photo, scroll to zoom.</p>

    <div class="group" id="layoutBtns" role="group" aria-label="Panel layout">
      <span class="glabel">Layout</span>
      <button type="button" data-layout="trio" class="on">Hero + Duo</button>
      <button type="button" data-layout="triptych">Triptych</button>
      <button type="button" data-layout="solo">Big One</button>
    </div>

    <div class="group" id="gradeBtns" role="group" aria-label="Colour grade">
      <span class="glabel">Grade</span>
      <button type="button" data-grade="sunset" class="on">Sunset</button>
      <button type="button" data-grade="neon">Neon</button>
      <button type="button" data-grade="night">Night</button>
    </div>

    <div class="group" id="sizeBtns" role="group" aria-label="Export size">
      <span class="glabel">Export size</span>
      <button type="button" data-size="1080x1080" class="on">1080 × 1080</button>
      <button type="button" data-size="1080x1350">1080 × 1350</button>
      <button type="button" data-size="1920x1080">1920 × 1080</button>
    </div>

    <label class="field">Title
      <input id="title" type="text" maxlength="40" value="Sunset Heist">
    </label>
    <label class="field">Subtitle
      <input id="subtitle" type="text" maxlength="48" value="VICE CITY • 2026">
    </label>

    <label class="field"><span id="panelName">Panel 1</span> zoom
      <span class="fileRow">
        <input id="zoom" type="range" min="1" max="3" step="0.05" value="1.15">
        <span id="zoomVal" class="zoomVal">1.15x</span>
      </span>
    </label>
    <div class="row">
      <button id="centerBtn" type="button">Centre photo</button>
      <button id="fillAllBtn" type="button">One photo, all panels</button>
    </div>

    <button id="export" type="button" class="export">Export PNG</button>
    <p id="status" role="status"></p>
  </section>

  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
